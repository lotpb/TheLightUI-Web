<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Offline — TheLight</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #030712;
      color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(env(safe-area-inset-top), 24px) 24px
                max(env(safe-area-inset-bottom), 24px);
    }
    .card {
      text-align: center;
      max-width: 320px;
      width: 100%;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 36px 28px;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      background: #1f2937;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 28px; height: 28px; color: #6b7280; }
    h1 { font-size: 1.125rem; font-weight: 600; color: #f9fafb; margin-bottom: 8px; }
    p  { font-size: 0.875rem; color: #9ca3af; line-height: 1.5; margin-bottom: 24px; }
    button {
      width: 100%;
      padding: 10px 16px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4338ca; }
    button:active { background: #3730a3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>TheLight can't connect right now. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
