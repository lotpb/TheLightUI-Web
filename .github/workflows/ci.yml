name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # TEMPORARY diagnostic — `npm ci` has been failing on the runner while
  # installing cleanly on macOS, and job logs aren't readable without repo
  # admin. Each matrix leg isolates one variable, so the pass/fail pattern
  # alone identifies the cause. Delete this job once CI is green.
  diagnose:
    name: "TEMP diag node${{ matrix.node }} ${{ matrix.mode }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        mode: ['full', 'noscripts']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # No cache: rules out a poisoned npm cache as the cause.
      - name: install
        run: |
          if [ "${{ matrix.mode }}" = "noscripts" ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm ci --no-audit --no-fund
          fi

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rules:
    name: Firestore rules (multi-tenancy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules

  functions:
    name: Cloud Functions (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
